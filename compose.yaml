name: pohvala

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_DOMAIN: ${APP_DOMAIN:-http://localhost}
  BOT_TOKEN: ${BOT_TOKEN:-dev-token}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev-webhook-secret}
  TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-dev-webhook-path}
  TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pohvala:pohvala@postgres:5432/pohvala}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TELEGRAM_MODE: ${VITE_TELEGRAM_MODE:-telegram}
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: pohvala-backend:latest
    restart: "no"
    logging: *default-logging
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.modules.mascots.seed"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: pohvala-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    # Keep exactly one replica: APScheduler runs inside this process.
    logging: *default-logging
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pohvala}
      POSTGRES_USER: ${POSTGRES_USER:-pohvala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pohvala}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
